name: Build Plugin

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Validate ServerVersion
      run: pwsh ./validate_version.ps1
    
    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Cache Gradle Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew shadowJar
    
    - name: Run Tests
      run: ./gradlew test
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-jar
        path: build/libs/*.jar
        
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # Checkout submodules

    - name: Setup Java 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew shadowJar

    - name: Create release package
      run: |
        mkdir release_package
        cp build/libs/*.jar release_package/
        cp README.md release_package/
        cp CHANGELOG.md release_package/
        cp src/main/resources/manifest.json release_package/

    - name: Deploy to main branch
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: main # The branch the action should deploy to.
        folder: release_package # The folder the action should deploy.
        clean: true # Automatically remove existing files in the branch
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
