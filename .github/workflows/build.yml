name: Build & CurseForge Auto Packaging

on:
  push:
    branches: [ develop ]     # Build/tests
    tags: [ 'v*', 'v*-alpha', 'v*-beta' ]  # Déclenche packaging
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: chmod +x gradlew

      - run: ./gradlew shadowJar

      - run: ./gradlew test

      - uses: actions/upload-artifact@v6
        with:
          name: plugin-jar
          path: build/libs/*.jar