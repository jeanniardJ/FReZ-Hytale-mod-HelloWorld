name: Build & CurseForge Auto Packaging

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', 'v*-alpha', 'v*-beta' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: chmod +x gradlew

      - name: Set plugin version with date
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          BASE_VERSION=$(grep "^pluginVersion" gradle.properties | cut -d'=' -f2 | cut -d'+' -f1)
          echo "PLUGIN_VERSION=${BASE_VERSION}+${BUILD_DATE}" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew shadowJar -PpluginVersion=${{ env.PLUGIN_VERSION }}

      - name: Run Tests
        run: ./gradlew test -PpluginVersion=${{ env.PLUGIN_VERSION }}

      # ↓ Nouveau step
      - name: Find JAR path
        id: jar
        run: echo "path=$(ls build/libs/*.jar)" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: ${{ steps.jar.outputs.path }}

      - name: Upload to CurseForge
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            -H "X-Api-Token: ${{ secrets.CURSEFORGE }}" \
            -F "metadata={\"projectID\":${{ secrets.CURSEFORGE_PROJECT_ID }},\"displayName\":\"HelloWorld-${{ env.PLUGIN_VERSION }}\",\"changelog\":\"${{ github.event.head_commit.message }}\",\"releaseType\":\"release\"};type=application/json" \
            -F "file=@${{ steps.jar.outputs.path }}" \
            https://www.curseforge.com/api/projects/${{ secrets.CURSEFORGE_PROJECT_ID }}/upload-file