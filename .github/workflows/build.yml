name: Build & CurseForge Auto Packaging

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*', 'v*-alpha', 'v*-beta' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - run: chmod +x gradlew

      - name: Set plugin version with date
        run: |
          BUILD_DATE=$(date +'%Y%m%d')
          BASE_VERSION=$(grep "^pluginVersion" gradle.properties | cut -d'=' -f2 | cut -d'+' -f1)
          echo "PLUGIN_VERSION=${BASE_VERSION}+${BUILD_DATE}" >> $GITHUB_ENV

      - name: Build with Gradle
        run: ./gradlew shadowJar -PpluginVersion=${{ env.PLUGIN_VERSION }}

      - name: Run Tests
        run: ./gradlew test -PpluginVersion=${{ env.PLUGIN_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar

      - name: Upload to CurseForge
        if: github.ref == 'refs/heads/main'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE }}
          project_id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          game_endpoint: hytale
          file_path: build/libs/*.jar
          changelog: ${{ github.event.head_commit.message }}
          display_name: HelloWorld-${{ env.PLUGIN_VERSION }}
